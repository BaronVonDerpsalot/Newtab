<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>—</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ── DS Color Tokens ─────────────────────────────── */
:root {
  --warm-50:#faf8f4;--warm-100:#f0ece3;--warm-150:#e4ded3;--warm-200:#cec7ba;
  --warm-300:#aaa098;--warm-400:#887e72;--warm-500:#665c50;--warm-600:#483e32;
  --warm-700:#2e261c;--warm-800:#1e1b14;--warm-850:#181510;--warm-900:#131108;--warm-950:#0a0906;
  --amber-100:#fdf0c8;--amber-200:#f5d388;--amber-300:#e8b84a;
  --amber-400:#d49810;--amber-500:#b87800;--amber-600:#946000;
}
:root,[data-theme="light"] {
  --bg:var(--warm-100);--bg-subtle:var(--warm-50);
  --surface:var(--warm-50);--surface-2:var(--warm-100);
  --border:rgba(20,17,8,.07);--border-strong:rgba(20,17,8,.15);
  --text-1:var(--warm-900);--text-2:var(--warm-400);--text-3:var(--warm-300);--text-label:var(--warm-400);
  --icon:var(--warm-700);--icon-muted:var(--warm-300);
  --fill-bg:var(--warm-900);--fill-text:var(--warm-50);--fill-hover:var(--warm-700);
  --accent:var(--amber-500);--accent-soft:rgba(184,120,0,.10);--accent-text:var(--warm-50);
}
[data-theme="dark"] {
  --bg:var(--warm-900);--bg-subtle:var(--warm-850);
  --surface:var(--warm-800);--surface-2:var(--warm-850);
  --border:rgba(250,248,244,.07);--border-strong:rgba(250,248,244,.14);
  --text-1:var(--warm-100);--text-2:var(--warm-400);--text-3:var(--warm-600);--text-label:var(--warm-500);
  --icon:var(--warm-200);--icon-muted:var(--warm-600);
  --fill-bg:var(--warm-100);--fill-text:var(--warm-900);--fill-hover:var(--warm-150);
  --accent:var(--amber-300);--accent-soft:rgba(232,184,74,.14);--accent-text:var(--warm-900);
}
/* ── DS Typography ───────────────────────────────── */
:root {
  --font-sans:'Space Grotesk',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'Space Mono','Courier New',monospace;
  --text-xs:10px;--text-sm:12px;--text-base:14px;--text-md:16px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:32px;
  --weight-light:300;--weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;
  --leading-tight:1.15;--leading-snug:1.3;--leading-normal:1.5;
  --tracking-tight:-0.02em;--tracking-wide:0.04em;--tracking-wider:0.10em;--tracking-widest:0.18em;
}
/* ── DS Spacing ──────────────────────────────────── */
:root {
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --space-8:32px;--space-10:40px;--space-12:48px;
  --radius-xs:3px;--radius-sm:6px;--radius-md:10px;--radius-lg:16px;
  --radius-xl:20px;--radius-2xl:24px;--radius-full:9999px;
  --card-pad:var(--space-6);
}
/* ── DS Effects ──────────────────────────────────── */
:root {
  --shadow-sm:0 2px 6px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.08);
  --ease-default:cubic-bezier(.4,0,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:110ms;--dur-normal:200ms;--dur-slow:320ms;--dur-theme:350ms;
  --trans-fast:var(--dur-fast) var(--ease-default);--trans-normal:var(--dur-normal) var(--ease-default);
  --blur-md:12px;
}
/* ── App-level variables ─────────────────────────── */
:root {
  --habit-green:#5a9e2f;--habit-green-soft:rgba(90,158,47,.12);--habit-green-border:rgba(90,158,47,.32);
  --card-r:var(--radius-xl);--grid-gap:12px;
}

/* ── Reset + base ────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text-1);font-family:var(--font-sans);
  font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background var(--dur-theme) var(--ease-default),color var(--dur-theme) var(--ease-default);
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* ── Auth overlay ────────────────────────────────── */
.auth-overlay{
  position:fixed;inset:0;background:var(--bg);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:2rem;
  transition:background var(--dur-theme) var(--ease-default);
}
.auth-box{width:100%;max-width:280px}
.auth-title{
  font-size:3rem;font-weight:200;letter-spacing:-0.04em;color:var(--text-1);
  text-align:center;margin-bottom:2rem;line-height:1;
}
.auth-row{display:flex;gap:.5rem}
.auth-input{
  flex:1;padding:.75rem 1rem;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text-1);font-family:inherit;font-size:.9rem;
  outline:none;transition:border-color .15s;
}
.auth-input:focus{border-color:var(--border-strong)}
.auth-submit{
  padding:.75rem 1rem;border:1px solid var(--border);border-radius:7px;
  background:var(--surface);color:var(--text-2);font-family:inherit;font-size:.9rem;
  cursor:pointer;transition:all .15s;line-height:1;
}
.auth-submit:hover{border-color:var(--border-strong);color:var(--text-1)}
.auth-error{
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--text-2);text-align:center;margin-top:.75rem;opacity:0;transition:opacity .2s;
}
.auth-error.visible{opacity:1}

/* ── Bento grid ──────────────────────────────────── */
.dashboard{
  display:grid;grid-template-columns:2.25fr 2fr 1.2fr 0.95fr;
  grid-template-rows:auto auto auto auto;
  gap:var(--grid-gap);max-width:1440px;margin:0 auto;padding:18px;
}
.cell-clock    {grid-column:1;grid-row:1}
.cell-stats    {grid-column:2;grid-row:1}
.cell-upcoming {grid-column:3;grid-row:1/3}
.cell-gallery  {grid-column:4;grid-row:1/5}
.cell-habits   {grid-column:1;grid-row:2/4}
.cell-prereqs  {grid-column:2;grid-row:2}
.cell-actions  {grid-column:2;grid-row:3/5}
.cell-shortcuts{grid-column:3;grid-row:3}
.cell-sliders  {grid-column:1;grid-row:4}
.cell-todo     {grid-column:3;grid-row:4}

/* ── Card base ───────────────────────────────────── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--card-r);padding:var(--card-pad);overflow:hidden;
  transition:background var(--dur-theme) var(--ease-default),
    border-color var(--dur-theme) var(--ease-default),
    border-radius var(--dur-normal) var(--ease-default);
}

/* ── Mono label ──────────────────────────────────── */
.mono-label{
  font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-widest);
  text-transform:uppercase;color:var(--text-label);
}

/* ── Clock ───────────────────────────────────────── */
.clock-time{
  font-size:clamp(52px,7.5vw,118px);font-weight:300;letter-spacing:-0.04em;
  line-height:1;color:var(--text-1);font-variant-numeric:tabular-nums;
}
.clock-date{
  font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-widest);
  color:var(--text-2);text-transform:uppercase;margin-top:12px;
}

/* ── Stats ───────────────────────────────────────── */
.stats-grid{display:grid;grid-template-columns:1fr 1px 1fr;height:100%;align-items:center}
.stat-divider{background:var(--border);height:50%}
.stat-block{padding:0 28px}
.stat-number{
  font-size:clamp(38px,5vw,72px);font-weight:300;letter-spacing:-0.03em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.stat-lbl{
  font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-widest);
  text-transform:uppercase;color:var(--text-label);margin-top:9px;
}

/* ── Habit rows ──────────────────────────────────── */
.habit-row{
  display:flex;align-items:center;gap:13px;padding:11px 0;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;
  transition:opacity var(--dur-fast) var(--ease-default);
}
.habit-row:last-child{border-bottom:none}
.habit-row:hover{opacity:.68}
.habit-dot{
  width:21px;height:21px;border-radius:50%;border:2px solid var(--border-strong);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:background var(--dur-fast),border-color var(--dur-fast);
}
.habit-dot.on{background:var(--habit-green);border-color:var(--habit-green)}
.habit-dot.on::after{
  content:'';width:5px;height:9px;border:2px solid #fff;
  border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;
}
.habit-text{font-size:14px;color:var(--text-2);transition:color var(--dur-fast)}
.habit-row.on .habit-text{color:var(--habit-green);font-weight:500}

/* ── Sliders card ────────────────────────────────── */
.slider-row{
  display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--border);
}
.slider-row:last-child{border-bottom:none}
.slider-meta{display:flex;align-items:baseline;gap:2px;min-width:128px;flex-shrink:0}
.slider-lbl{font-size:13px;color:var(--text-label)}
.slider-val{font-size:13px;font-weight:600;transition:color 80ms}
.slider-unit{font-family:var(--font-mono);font-size:9px;color:var(--text-2);
  letter-spacing:var(--tracking-wide);text-transform:uppercase}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;
  border-radius:2px;outline:none;cursor:pointer;flex:1;transition:background 80ms;
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--thumb-c,var(--accent));border:2.5px solid var(--bg);
  cursor:pointer;transition:background 80ms,transform var(--dur-fast);
  box-shadow:0 1px 5px rgba(0,0,0,.3);
}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type="range"]::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;
  background:var(--thumb-c,var(--accent));border:2.5px solid var(--bg);cursor:pointer;
}
.mood-dot{
  width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);
  background:transparent;cursor:pointer;
  transition:background 80ms,border-color 80ms,transform var(--dur-fast);
  padding:0;flex-shrink:0;
}
.mood-dot:hover{transform:scale(1.18)}
.mood-dot.lit{background:var(--dot-c);border-color:var(--dot-c)}

/* ── Prereqs ─────────────────────────────────────── */
.prereq-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);
  margin-bottom:8px;cursor:pointer;
  transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast);
  font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-wider);
  text-transform:uppercase;color:var(--text-2);
}
.prereq-row:last-child{margin-bottom:0}
.prereq-row:hover{background:var(--surface-2)}
.prereq-row.done{background:var(--habit-green-soft);border-color:var(--habit-green-border);color:var(--habit-green)}
.prereq-row.readonly{cursor:default}
.prereq-row.readonly:hover{background:transparent}
.prereq-row.readonly.done:hover{background:var(--habit-green-soft)}

/* ── Action buttons ──────────────────────────────── */
.action-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:transparent;color:var(--text-2);font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:var(--tracking-wider);text-transform:uppercase;
  cursor:pointer;margin-bottom:8px;
  transition:background var(--dur-fast),color var(--dur-fast),border-color var(--dur-fast);
}
.action-btn:last-child{margin-bottom:0}
.action-btn:hover{background:var(--surface-2);color:var(--text-1)}
.action-btn.strong{border-color:var(--border-strong);color:var(--text-1);font-weight:600}
.action-btn.strong:hover{background:var(--fill-bg);color:var(--fill-text);border-color:var(--fill-bg)}
.action-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.action-row-2 .action-btn{margin-bottom:0}

/* ── Milestones ──────────────────────────────────── */
.milestone-item{
  display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);align-items:flex-start;
}
.milestone-item:last-child{border-bottom:none}
.m-date{min-width:36px;text-align:center}
.m-day{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1;color:var(--accent)}
.m-month{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;
  letter-spacing:var(--tracking-wide);color:var(--text-2);margin-top:2px}
.m-title{font-size:13px;font-weight:500;color:var(--text-1);line-height:1.3}
.m-sub{font-size:11px;color:var(--text-2);margin-top:3px}

/* ── Shortcuts ───────────────────────────────────── */
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.shortcut-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:14px 6px;border:1px solid var(--border);border-radius:var(--radius-md);
  background:var(--surface-2);color:var(--text-2);font-family:var(--font-mono);
  font-size:8px;letter-spacing:var(--tracking-widest);text-transform:uppercase;cursor:pointer;
  transition:background var(--dur-fast),border-color var(--dur-fast),color var(--dur-fast);
}
.shortcut-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ── Todo ────────────────────────────────────────── */
.todo-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;
  transition:opacity var(--dur-fast);
}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{opacity:.7}
.todo-box{
  width:15px;height:15px;border-radius:var(--radius-xs);border:1.5px solid var(--border-strong);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:background var(--dur-fast),border-color var(--dur-fast);
}
.todo-box.done{background:var(--accent);border-color:var(--accent)}
.todo-box.done::after{
  content:'';width:4px;height:7px;border:1.5px solid white;
  border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);display:block;
}
.todo-text{font-size:12px;color:var(--text-2)}
.todo-text.done{text-decoration:line-through;opacity:.38}

/* ── Gallery ─────────────────────────────────────── */
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0}
.gallery-slot{
  border-radius:var(--radius-md);overflow:hidden;aspect-ratio:1;
  background:var(--surface-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:9px;color:var(--text-label);
  letter-spacing:.1em;text-transform:uppercase;
  transition:background var(--dur-fast),border-color var(--dur-fast);
}
.gallery-slot:hover{background:var(--border);border-color:var(--border-strong)}

/* ── Modal ───────────────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.52);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;z-index:400;
  animation:fadeIn 140ms ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--radius-2xl);padding:34px;
  width:min(520px,93vw);max-height:90vh;overflow-y:auto;
  position:relative;
  animation:slideUp 190ms var(--ease-spring);
}
.modal-box.chat{display:flex;flex-direction:column;max-height:min(640px,88vh);padding-bottom:0}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-close-btn{
  position:absolute;top:18px;right:18px;background:transparent;
  border:1px solid var(--border);border-radius:var(--radius-full);
  width:30px;height:30px;cursor:pointer;color:var(--text-2);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--dur-fast),color var(--dur-fast);
}
.modal-close-btn:hover{background:var(--surface-2);color:var(--text-1)}
.modal-eyebrow{
  font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-widest);
  text-transform:uppercase;color:var(--accent);margin-bottom:8px;
}
.modal-title{font-size:22px;font-weight:600;letter-spacing:var(--tracking-tight);margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--text-2);margin-bottom:24px;line-height:1.5}
.m-divider{height:1px;background:var(--border);margin:12px 0}
.mc p{font-size:.85rem;line-height:1.65;color:var(--text-2);margin-bottom:.6rem}
.mc p strong{color:var(--text-1);font-weight:600}
.mc h2{font-size:.95rem;font-weight:600;color:var(--text-1);margin:1.4rem 0 .4rem}
.mc h2:first-child{margin-top:0}
.mc ul{list-style:none;padding:0}
.mc ul li{font-size:.83rem;color:var(--text-2);padding:.55rem 0 .55rem 1rem;
  position:relative;border-bottom:1px solid var(--border);line-height:1.5}
.mc ul li:last-child{border-bottom:none}
.mc ul li::before{content:'—';position:absolute;left:0;color:var(--border)}
.mc ul li strong{color:var(--text-1)}
.mc .big{font-size:2.75rem;font-weight:700;letter-spacing:-0.04em;color:var(--text-1);
  display:block;line-height:1;margin:.5rem 0 .25rem}
.callout{
  background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  padding:.9rem 1rem;margin:1rem 0;font-size:.83rem;line-height:1.6;color:var(--text-2);
}
.callout strong{color:var(--text-1)}
.mhr{border:none;border-top:1px solid var(--border);margin:1.25rem 0}

/* ── Chat modal internals ────────────────────────── */
.chat-messages{
  flex:1;overflow-y:auto;padding:14px 0;
  display:flex;flex-direction:column;gap:10px;min-height:0;
}
.chat-msg{
  max-width:85%;padding:.6rem .85rem;border-radius:10px;
  font-size:.875rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;
}
.chat-msg.user{
  align-self:flex-end;background:var(--habit-green);color:#fff;border-bottom-right-radius:3px;
}
.chat-msg.assistant{
  align-self:flex-start;background:var(--surface-2);color:var(--text-1);border-bottom-left-radius:3px;
}
.chat-typing{
  align-self:flex-start;background:var(--surface-2);border-radius:10px;
  border-bottom-left-radius:3px;padding:.75rem 1rem;display:flex;gap:4px;align-items:center;
}
.chat-typing span{width:6px;height:6px;border-radius:50%;background:var(--text-2);
  animation:chatdot 1.2s ease-in-out infinite}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes chatdot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chat-input-area{
  flex-shrink:0;display:flex;gap:.55rem;align-items:flex-end;
  padding:12px 0 24px;border-top:1px solid var(--border);
}
.chat-input{
  flex:1;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-md);color:var(--text-1);font-family:inherit;
  font-size:.875rem;line-height:1.5;padding:.6rem .75rem;resize:none;
  max-height:120px;overflow-y:auto;outline:none;
  transition:border-color var(--dur-fast);
}
.chat-input:focus{border-color:var(--border-strong)}
.chat-input::placeholder{color:var(--text-2)}
.chat-send{
  background:var(--habit-green);border:none;border-radius:var(--radius-md);color:#fff;
  cursor:pointer;font-size:1.15rem;width:2.5rem;height:2.5rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:opacity .15s;line-height:1;
}
.chat-send:hover{opacity:.85}
.chat-send:disabled{opacity:.35;cursor:default}

/* ── Insight modal ───────────────────────────────── */
.insight-body{font-size:.86rem;line-height:1.7;color:var(--text-1);white-space:pre-wrap}
.insight-body.muted{color:var(--text-2)}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(() => {
    try {
      const s = localStorage.getItem('nt_tweaks_v2');
      return s ? { ...defaults, ...JSON.parse(s) } : defaults;
    } catch { return defaults; }
  });
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => {
      const next = { ...prev, ...edits };
      try { localStorage.setItem('nt_tweaks_v2', JSON.stringify(next)); } catch {}
      return next;
    });
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children, open, onClose }) {
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clamp = React.useCallback(() => {
    const p = dragRef.current; if (!p) return;
    const w = p.offsetWidth, h = p.offsetHeight;
    offsetRef.current = {
      x: Math.min(Math.max(PAD, offsetRef.current.x), Math.max(PAD, window.innerWidth - w - PAD)),
      y: Math.min(Math.max(PAD, offsetRef.current.y), Math.max(PAD, window.innerHeight - h - PAD)),
    };
    p.style.right = offsetRef.current.x + 'px';
    p.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clamp();
    window.addEventListener('resize', clamp);
    return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);
  const onDragStart = (e) => {
    const p = dragRef.current; if (!p) return;
    const r = p.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const move = ev => {
      offsetRef.current = { x: sr - (ev.clientX - sx), y: sb - (ev.clientY - sy) };
      clamp();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={onClose}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

}

  );
}
function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>

        {options.map(o => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}
function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value); valueRef.current = value;
  const labelLen = o => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fits = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fits) {
    const resolve = s => { const m = options.find(o => String(typeof o === 'object' ? o.value : o) === s); return m === undefined ? s : typeof m === 'object' ? m.value : m; };
    return <TweakSelect label={label} value={value} options={options} onChange={s => onChange(resolve(s))} />;
  }
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  const segAt = cx => { const r = trackRef.current.getBoundingClientRect(); const inner = r.width - 4; const i = Math.floor(((cx - r.left - 2) / inner) * n); return opts[Math.max(0, Math.min(n - 1, i))].value; };
  const onPointerDown = e => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = ev => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map(o => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value} onChange={e => onChange(e.target.value)} />
      </div>
    );
  }
  const key = o => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o]; const [hero] = colors; const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio" aria-checked={on}
              data-on={on ? '1' : '0'} style={{ background: hero }} onClick={() => onChange(o)}>
              {on && <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff" /></svg>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

  if (fmt === 'iso')   return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
  return `${day.toUpperCase()} ${date} ${mon.toUpperCase()}`;
}
function todayStr() { return new Date().toISOString().split('T')[0]; }

function getCookie(name) {

/* ── SunCalc (compact) ────────────────────────────── */
const RAD=Math.PI/180,DAY_MS=864e5,J1970=2440588,J2000=2451545;
const toJulian=d=>d.valueOf()/DAY_MS-.5+J1970,fromJulian=j=>new Date((j+.5-J1970)*DAY_MS),toDays=d=>toJulian(d)-J2000;
const EOBL=RAD*23.4397,sMA=d=>RAD*(357.5291+.98560028*d);
const eLon=M=>M+RAD*(1.9148*Math.sin(M)+.02*Math.sin(2*M)+.0003*Math.sin(3*M))+RAD*102.9372+Math.PI;
const decl=l=>Math.asin(Math.sin(EOBL)*Math.sin(l));
const jCycle=(d,lw)=>Math.round(d-.0009-lw/(2*Math.PI));
const appTrans=(Ht,lw,n)=>.0009+(Ht+lw)/(2*Math.PI)+n;
const solTransJ=(ds,M,L)=>J2000+ds+.0053*Math.sin(M)-.0069*Math.sin(2*L);
const hourAngle=(h,phi,d)=>Math.acos((Math.sin(h)-Math.sin(phi)*Math.sin(d))/(Math.cos(phi)*Math.cos(d)));
function sunTimes(date,lat,lng){
  const lw=RAD*-lng,phi=RAD*lat,d=toDays(date);
  const n=jCycle(d,lw),ds=appTrans(0,lw,n),M=sMA(ds),L=eLon(M),dec=decl(L);
  const Jnoon=solTransJ(ds,M,L),w=hourAngle(-.833*RAD,phi,dec);
  const Jset=solTransJ(appTrans(w,lw,n),M,L),Jrise=Jnoon-(Jset-Jnoon);
  return{sunrise:fromJulian(Jrise),sunset:fromJulian(Jset)};
}
function autoIsDark() {
  try { const{sunrise,sunset}=sunTimes(new Date(),LOCATION.lat,LOCATION.lng); const now=Date.now(); return now>=sunset.getTime()||now<sunrise.getTime(); }
  catch{return false;}
}

function freshDefaults() {

    windowDate:null, goodStuff:{date:todayStr(),values:{}}, sessionsToday:0,
    lastInsight:null, lastInsightAt:null };
}
function normalizeGoodStuff(gs) {
  if (!gs || gs.date !== todayStr()) return { date:todayStr(), values:{} };
  if (gs.values && typeof gs.values === 'object') return { date:gs.date, values:gs.values };
  if (Array.isArray(gs.items)) { const values={}; for(const k of gs.items) values[k]=true; return{date:gs.date,values}; }
  return { date:todayStr(), values:{} };
}
function daysActive(startDate) { return Math.max(0, Math.floor((new Date()-new Date(startDate))/86400000))+1; }
function exerciseDoneToday(ed) { return ed === todayStr(); }

/* ── Supabase ─────────────────────────────────────── */
async function fetchState() {
  try {
    const{data,error}=await db.from('tab_state')
      .select('sessions_avoided,start_date,exercise_date,window_date,theme,good_stuff,last_insight,last_insight_at')
      .eq('user_id',USER_ID).maybeSingle();
    if(error||!data) return{state:freshDefaults(),ok:false};
    let goodStuff=normalizeGoodStuff(data.good_stuff),sessionsToday=0;
    try {
      const{data:row}=await db.from('daily_log')
        .select('values,sessions_today').eq('user_id',USER_ID).eq('log_date',todayStr()).maybeSingle();
      if(row){if(row.values&&typeof row.values==='object') goodStuff={date:todayStr(),values:row.values}; sessionsToday=row.sessions_today??0;}
    }catch{}
    return{state:{
      theme:data.theme||'dark',sessionsAvoided:data.sessions_avoided??0,
      startDate:data.start_date||todayStr(),exerciseDate:data.exercise_date||null,
      windowDate:data.window_date||null,goodStuff,sessionsToday,
      lastInsight:data.last_insight||null,lastInsightAt:data.last_insight_at||null,
    },ok:true};
  }catch{return{state:freshDefaults(),ok:false};}
}
async function saveState(S) {
  const now=new Date().toISOString(),today=todayStr(); let ok=true;
  try{const{error}=await db.from('tab_state').upsert({user_id:USER_ID,sessions_avoided:S.sessionsAvoided,start_date:S.startDate,exercise_date:S.exerciseDate,window_date:S.windowDate,theme:S.theme,good_stuff:S.goodStuff,last_insight:S.lastInsight,last_insight_at:S.lastInsightAt,updated_at:now},{onConflict:'user_id'});if(error)ok=false;}catch{ok=false;}
  try{const{error}=await db.from('daily_log').upsert({user_id:USER_ID,log_date:today,values:S.goodStuff.values,exercise_done:S.exerciseDate===today,window_open:windowOpenToday(),sessions_today:S.sessionsToday||0,updated_at:now},{onConflict:'user_id,log_date'});if(error)ok=false;}catch{ok=false;}
  return ok;
}
async function fetchHistory(days=30) {
  try{const{data}=await db.from('daily_log').select('log_date,values,exercise_done,window_open,sessions_today').eq('user_id',USER_ID).order('log_date',{ascending:false}).limit(days);return data||[];}catch{return[];}
}
async function buildStats(S) {
  const rows=await fetchHistory(30),asc=[...rows].reverse();
  const avg=arr=>arr.length?Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10:null;
  const habitSummary={};
  for(const h of HABITS){
    if(h.type==='bool'){
      const d7=rows.slice(0,7),d30=rows;
      habitSummary[h.key]={label:h.label,type:'bool',last7_days_done:`${d7.filter(r=>r.values&&r.values[h.key]===true).length}/${d7.length}`,last30_days_done:`${d30.filter(r=>r.values&&r.values[h.key]===true).length}/${d30.length}`};
    } else {
      const v7=rows.slice(0,7).map(r=>r.values&&r.values[h.key]!=null?Number(r.values[h.key]):null).filter(v=>v!=null);
      const v30=rows.map(r=>r.values&&r.values[h.key]!=null?Number(r.values[h.key]):null).filter(v=>v!=null);
      habitSummary[h.key]={label:h.label,type:'numeric',unit:h.unit||'',avg_last7:avg(v7),avg_last30:avg(v30),days_tracked_30:v30.length};
    }
  }
  return{today:todayStr(),days_active:daysActive(S.startDate),sessions_avoided_total:S.sessionsAvoided,sessions_avoided_today:S.sessionsToday,sessions_avoided_last7:asc.slice(-7).reduce((a,r)=>a+(r.sessions_today||0),0),exercise_done_last7:rows.slice(0,7).filter(r=>r.exercise_done).length,habits:habitSummary};
}

function TimerModal() {
  const PRESETS=[25,10,5];
  const [preset,setPreset]=useState(25);
  const [secs,setSecs]=useState(25*60);
  const [running,setRunning]=useState(false);
  const [done,setDone]=useState(false);
  const intRef=useRef(null);
  useEffect(()=>{
    if(running&&secs>0){intRef.current=setInterval(()=>setSecs(s=>s-1),1000);}
    else if(secs===0&&running){setRunning(false);setDone(true);}
    return()=>clearInterval(intRef.current);
  },[running,secs]);
  const reset=(p)=>{const mins=p||preset;setRunning(false);setDone(false);setSecs(mins*60);};
  const total=preset*60,pct=((total-secs)/total)*100,R=70,C=2*Math.PI*R;
  const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');
  return (
    <div>
      <div className="modal-eyebrow">Pomodoro</div>

      <div style={{display:'flex',gap:8,marginBottom:24}}>

          <button key={p} onClick={()=>{setPreset(p);reset(p);}}

            {p} min
          </button>
        ))}
      </div>
      <div style={{textAlign:'center'}}>
        <svg width="170" height="170" viewBox="0 0 170 170" style={{display:'block',margin:'0 auto 20px'}}>
          <circle cx="85" cy="85" r={R} fill="none" stroke="var(--border)" strokeWidth="6"/>
          <circle cx="85" cy="85" r={R} fill="none" stroke="var(--accent)" strokeWidth="6"
            strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} strokeLinecap="round"
            transform="rotate(-90 85 85)" style={{transition:running?'stroke-dashoffset 0.9s linear':'none'}}/>
          <text x="85" y="93" textAnchor="middle" fill="var(--text-1)"
            style={{fontFamily:'var(--font-sans)',fontSize:34,fontWeight:300,letterSpacing:'-0.03em'}}>{m}:{s}</text>
        </svg>
        {done&&<div style={{color:'var(--accent)',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'.16em',marginBottom:16}}>SESSION COMPLETE</div>}
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button className="action-btn" style={{width:'auto',padding:'10px 32px'}} onClick={()=>setRunning(r=>!r)}>{running?'Pause':done?'Again':'Start'}</button>
          <button className="action-btn" style={{width:'auto',padding:'10px 22px'}} onClick={()=>reset()}>Reset</button>
        </div>
      </div>
    </div>
  );
}

  },[active,count,phase]);
  const scl=active&&phase===0?1:active&&(phase===2||phase===3)?.58:.72;
  const dur=phase===0?'4s':phase===2?'6s':'0.3s';
  return (
    <div style={{textAlign:'center'}}>
      <div className="modal-eyebrow" style={{textAlign:'left'}}>4-2-6-2 pattern</div>
      <div className="modal-title" style={{textAlign:'left',marginBottom:36}}>Breathing</div>

          <span style={{fontFamily:'var(--font-mono)',fontSize:30,fontWeight:700,color:'var(--accent)'}}>{active?count:'–'}</span>

function ChatModal({ S }) {
  const [messages,setMessages]=useState([]);

  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages,typing]);
  function buildSystem(S) {
    const gs=S.goodStuff.values;
    const done=BOOL_HABITS.filter(h=>gs[h.key]===true).map(h=>h.label);
    return `You are a calm, direct support voice for someone struggling with compulsive porn use right now.\n\nDashboard: Sessions avoided: ${S.sessionsAvoided}, Days active: ${daysActive(S.startDate)}, Exercise today: ${exerciseDoneToday(S.exerciseDate)?'yes':'no'}, Window open: ${windowOpenToday()?'yes':'no'}, Mood: ${gs.mood??'not logged'}/5, Sleep: ${gs.sleep_hours??'not logged'}h, Water: ${gs.water??'not logged'}L, Habits done: ${done.length?done.join(', '):'none'}.\n\nSystem: DNS blocking, scheduled windows, exercise as prerequisite. They've quit 40-a-day smoking and alcohol.\n\nJob: get them through the next 20 minutes. Be direct, no cotton wool, short responses. Ask what's happening if they don't say.`;
  }
  const send=async()=>{
    const text=input.trim(); if(!text||typing)return;
    setInput('');
    const msgs=[...messages,{role:'user',content:text}];
    setMessages(msgs); setTyping(true);
    try {
      const res=await fetch(CHAT_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY,'x-app-token':APP_TOKEN},body:JSON.stringify({system:buildSystem(S),messages:msgs})});
      if(!res.ok)throw new Error(res.status);
      const data=await res.json();
      setMessages(m=>[...m,{role:'assistant',content:(data.reply||'').trim()||'No response.'}]);
    }catch{setMessages(m=>[...m,{role:'assistant',content:'Something went wrong. Check your connection and try again.'}]);}
    finally{setTyping(false);}
  };
  return (
    <div style={{display:'flex',flexDirection:'column',height:'54vh',minHeight:320}}>
      <div className="modal-eyebrow">Crisis support</div>
      <div className="modal-title" style={{marginBottom:0}}>Need Help Right Now</div>
      <div className="chat-messages" style={{flex:1}}>
        {messages.map((m,i)=><div key={i} className={`chat-msg ${m.role}`}>{m.content}</div>)}
        {typing&&<div className="chat-typing"><span/><span/><span/></div>}
        <div ref={endRef}/>
      </div>
      <div className="chat-input-area">
        <textarea className="chat-input" rows={1} value={input} placeholder="What's going on?"
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
          onInput={e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';}} />
        <button className="chat-send" disabled={typing} onClick={send}>↑</button>
      </div>
    </div>
  );
}

function InsightsModal({ S }) {
  const [body,setBody]=useState(S.lastInsight||'');
  const [meta,setMeta]=useState('');
  const [loading,setLoading]=useState(false);
  useEffect(()=>{
    if(S.lastInsight){setBody(S.lastInsight);setMeta(S.lastInsightAt?`Last updated ${fmtAgo(S.lastInsightAt)}`:'');}
    else{setBody('');setMeta('');}
  },[]);
  function fmtAgo(iso){const diff=Date.now()-new Date(iso).getTime();const mins=Math.floor(diff/60000);if(mins<1)return'just now';if(mins<60)return`${mins}m ago`;const hrs=Math.floor(mins/60);if(hrs<24)return`${hrs}h ago`;return`${Math.floor(hrs/24)}d ago`;}
  const refresh=async()=>{
    if(loading)return; setLoading(true); setBody('Reading your stats…'); setMeta('');
    try{
      const stats=await buildStats(S);
      const res=await fetch(FEEDBACK_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY,'x-app-token':APP_TOKEN},body:JSON.stringify({stats})});
      if(!res.ok)throw new Error(res.status);
      const data=await res.json();
      const text=(data.feedback||'').trim()||'No response.';
      setBody(text); setMeta('Just now');
      S.lastInsight=text; S.lastInsightAt=new Date().toISOString();
      await saveState(S);
    }catch{setBody('Could not reach Claude right now. Check that the feedback function is deployed, then try again.');}
    finally{setLoading(false);}
  };
  useEffect(()=>{if(!S.lastInsight&&!loading)refresh();},[]);
  return (
    <div>
      <div className="modal-eyebrow">Claude</div>
      <div className="modal-title">Insights</div>
      {meta&&<div style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--text-2)',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:14}}>{meta}</div>}
      <div className={`insight-body ${body&&body!=='Reading your stats…'?'':'muted'}`}>{body||'No insights yet — tap Refresh.'}</div>
      <div style={{marginTop:18,display:'flex',justifyContent:'flex-end'}}>
        <button className="action-btn" style={{width:'auto',padding:'8px 20px'}} disabled={loading} onClick={refresh}>{loading?'Loading…':'Refresh'}</button>
      </div>
    </div>
  );
}

/* ── History modal (real Supabase data) ───────────── */
function HistoryModal() {
  const [rows,setRows]=useState(null);
  useEffect(()=>{fetchHistory(30).then(setRows);},[]);
  if(!rows) return <div><div className="modal-title">History</div><div className="hist-empty">Loading…</div></div>;
  if(!rows.length) return <div><div className="modal-title">History</div><div className="hist-empty">No history yet.<br/>Track a few days and trends will show up here.</div></div>;
  const asc=[...rows].reverse(),last14=asc.slice(-14);
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  function NumericBlock({label,vals,maxV,unit,stat}){
    const bars=vals.map((v,i)=>{
      if(v==null)return<div key={i} className="hist-bar empty" style={{height:'6%'}}></div>;
      const pct=maxV>0?Math.max(6,(v/maxV)*100):6;
      return<div key={i} className="hist-bar" style={{height:pct+'%'}}></div>;
    });
    return(
      <div className="hist-row">
        <div className="hist-head"><span className="hist-label">{label}</span><span className="hist-stat">{stat||''}</span></div>
        <div className="hist-strip">{bars}</div>
      </div>
    );
  }
  const maxSessions=Math.max(1,...asc.map(r=>r.sessions_today||0));
  return (
    <div>
      <div className="modal-eyebrow">Last 30 days</div>
      <div className="modal-title">History</div>
      <div className="mc">
        <NumericBlock label="Sessions avoided" vals={asc.map(r=>r.sessions_today||0)} maxV={maxSessions} stat={`${asc.reduce((a,r)=>a+(r.sessions_today||0),0)} total`}/>
        {HABITS.map(h=>{
          if(h.type==='bool'){
            const pct=Math.round((rows.filter(r=>r.values&&r.values[h.key]===true).length/rows.length)*100);
            const strip=last14.map((r,i)=><div key={i} className={`hist-cell ${r.values&&r.values[h.key]===true?'on':''}`} style={{height:'100%'}}></div>);
            return(<div key={h.key} className="hist-row">
              <div className="hist-head"><span className="hist-label">{h.label}</span><span className="hist-stat">{pct}% · {rows.filter(r=>r.values&&r.values[h.key]===true).length}/{rows.length} days</span></div>
              <div className="hist-strip">{strip}</div>
            </div>);
          } else {
            const vals=rows.map(r=>r.values&&r.values[h.key]!=null?Number(r.values[h.key]):null);
            const present=vals.filter(v=>v!=null);if(!present.length)return null;
            const a7=avg(rows.slice(0,7).map(r=>r.values&&r.values[h.key]!=null?Number(r.values[h.key]):null).filter(v=>v!=null));
            const a30=avg(present);
            return<NumericBlock key={h.key} label={h.label} vals={asc.map(r=>r.values&&r.values[h.key]!=null?Number(r.values[h.key]):null)} maxV={Math.max(...present)} stat={`7d ${Math.round(a7*10)/10}${h.unit||''} · 30d ${Math.round(a30*10)/10}${h.unit||''}`}/>;
          }
        })}
      </div>
    </div>
  );
}

  useEffect(()=>{
    const s=ACCENT_MAP[t.accentScheme]||ACCENT_MAP.amber,dark=t.theme==='dark'||(t.theme==='auto'&&autoIsDark());

          <TweakSlider label="Grid gap" value={t.gridGap} min={4} max={24} step={2} unit="px" onChange={v=>setTweak('gridGap',v)}/>
          <TweakSection label="Habits"/>
          <TweakColor label="Check colour" value={t.habitColor} options={['#5a9e2f','#e8b84a','#4a9e8f','#e87a8a','#7a6fbf']} onChange={v=>setTweak('habitColor',v)}/>
        </TweaksPanel>
      </div>

      {/* Fixed chrome */}
      <div className="live-dot" data-sync={syncState==='idle'?undefined:syncState} onClick={syncState==='error'?()=>save(S):undefined}>
        <span>{syncState==='syncing'?'Syncing':syncState==='error'?'Error — tap to retry':'Live'}</span>
        <span className="live-version">{VERSION}</span>
      </div>
      <button className="reset-btn" onClick={()=>{if(confirm('Reset all tracking data?')){const fresh=freshDefaults();setS(fresh);save(fresh);}}}>Reset</button>
      <button className="tweaks-trigger" onClick={()=>setTweaksOpen(true)} title="Tweaks">✦</button>

      {modal&&<Modal id={modal} onClose={()=>setModal(null)} S={S}/>}
    </>
  );
}

/* ── Boot ─────────────────────────────────────────── */
function boot() {
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}

function submitPassword() {
  if(document.getElementById('pwInput').value===PASSWORD){
    setAuthCookie();
    document.getElementById('authOverlay').style.display='none';
    boot();
  } else {
    const err=document.getElementById('pwError');
    err.classList.add('visible');
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
    setTimeout(()=>err.classList.remove('visible'),2000);
  }
}

if(getCookie(COOKIE_NAME)==='1'){
  document.getElementById('authOverlay').style.display='none';
  boot();
} else {
  document.getElementById('pwSubmit').addEventListener('click',submitPassword);
  document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitPassword();});
  document.getElementById('pwInput').focus();
}
</script>

</body>
</html>
